name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIM/C1WEgzM4N4Nbcc5REYytzPf3VPDVJOvz3Y+97WAul github-actions-deploy}}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.165.22.181.183}} >> ~/.ssh/known_hosts

      - name: Deploy to server
        run: |
          ssh ${{ secrets.root}}@${{ secrets.165.22.181.183}} << 'EOF'
            cd /root/iso-grc
            git pull
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --build
          EOF