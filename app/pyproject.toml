[project]
name = "iso-grc-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.30", "jinja2>=3.1", "python-multipart>=0.0.9",
  "sqlalchemy>=2.0.36", "psycopg[binary]>=3.2", "pgvector>=0.3", "alembic>=1.14",
  "pydantic>=2.9", "httpx>=0.27", "argon2-cffi>=23.1", "itsdangerous>=2.2",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","S"]
[tool.mypy]
strict = true
[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false