{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-top: 0;">Iniciar Sesión</h2>
    <form method="POST" action="/web/login">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" name="email" required value="demo@grc.com">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required value="SecurePass123!">
        </div>
        <button type="submit" class="btn" style="width: 100%;">Entrar</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #64748b;">
        ¿No tienes cuenta? <a href="/register" style="color: var(--primary);">Regístrate</a>
    </p>
</div>
{% endblock %}
