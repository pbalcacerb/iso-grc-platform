{% extends "base.html" %}
{% block content %}
<div class="container" style="max-width: 600px; margin: 2rem auto;">
    <h1>Crear Nueva Auditoría</h1>
    
    <form method="POST" action="/web/audits" style="margin-top: 1rem;">
        <div class="form-group">
            <label for="name">Nombre de la Auditoría</label>
            <input type="text" id="name" name="name" required 
                   style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
        </div>
        
        <div class="form-group">
            <label for="client_id">Cliente</label>
            <select id="client_id" name="client_id" required 
                    style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
                {% for client in clients %}
                <option value="{{ client.id }}">{{ client.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="standard_id">Estándar</label>
            <select id="standard_id" name="standard_id" required 
                    style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
                {% for standard in standards %}
                <option value="{{ standard.id }}">{{ standard.code }} - {{ standard.name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="form-group">
            <label for="status">Estado</label>
            <select id="status" name="status" 
                    style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
                <option value="planned">Planificada</option>
                <option value="in_progress">En Progreso</option>
                <option value="completed">Completada</option>
            </select>
        </div>
        
        <div style="margin-top: 1.5rem;">
            <button type="submit" class="btn">Crear Auditoría</button>
            <a href="/dashboard" class="btn" style="background: #64748b; margin-left: 0.5rem;">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
