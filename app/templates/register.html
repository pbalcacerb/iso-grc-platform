{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width: 400px; margin: 4rem auto;">
    <h2 style="text-align: center; margin-top: 0;">Crear Cuenta</h2>
    <form method="POST" action="/web/register">
        <div class="form-group">
            <label>Nombre Completo</label>
            <input type="text" name="full_name" required>
        </div>
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" name="email" required>
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required>
        </div>
        <button type="submit" class="btn" style="width: 100%;">Registrarme</button>
    </form>
    <p style="text-align: center; margin-top: 1rem; font-size: 0.9rem; color: #64748b;">
        <a href="/login" style="color: var(--primary);">Volver al login</a>
    </p>
</div>
{% endblock %}
