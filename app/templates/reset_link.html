{% extends "base.html" %}
{% block page_title %}Enlace de Restablecimiento{% endblock %}
{% block content %}

<div class="card" style="max-width: 600px;">
    <h3 style="margin-top: 0;">🔑 Enlace generado para {{ email }}</h3>
    <p class="text-sm text-slate-600" style="margin-bottom: 1rem;">
        Copia este enlace y entrégalo al usuario por un canal seguro.
        <strong>Expira en 60 minutos</strong> y es de un solo uso.
    </p>
    <div style="background:#f1f5f9;border:1px solid #e2e8f0;border-radius:6px;padding:0.75rem;word-break:break-all;font-family:monospace;font-size:0.85rem;">
        {{ link }}
    </div>
    <div style="margin-top: 1rem;">
        <a href="/users" class="btn" style="background:#64748b;">← Volver a Usuarios</a>
    </div>
</div>

{% endblock %}
