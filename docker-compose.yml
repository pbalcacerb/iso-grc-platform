services:
  db:
    image: pgvector/pgvector:pg16
    container_name: grc-db
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: grc
      POSTGRES_PASSWORD: grc
      POSTGRES_DB: grc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grc"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  app:
    image: iso-grc-app
    container_name: iso-grc-app-1
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://grc:grc@db:5432/grc
      AI_PROVIDER: azure_openai
      # Añade aquí otras variables que necesite tu app (SECRET_KEY, etc.)
    depends_on:
      db:
        condition: service_healthy
