{% extends "base.html" %}
{% block content %}
<div class="header">
    <h1>Gestión de Usuarios</h1>
    <a href="/dashboard" class="btn" style="background: #64748b;">← Volver</a>
</div>

<div class="card">
    <h3 style="margin-top: 0;">Invitar Usuario</h3>
    <form method="POST" action="/users/invite">
        <div class="form-group"><label>Nombre Completo</label>
            <input type="text" name="full_name" required></div>
        <div class="form-group"><label>Correo Electrónico</label>
            <input type="email" name="email" required></div>
        <div class="form-group"><label>Contraseña Temporal</label>
            <input type="password" name="password" required></div>
        <div class="form-group"><label>Rol</label>
            <select id="role" name="role" required
        style="width: 100%; padding: 0.5rem; margin-top: 0.25rem;">
        <option value="lead_auditor">Auditor Líder</option>
        <option value="auditor">Auditor</option>
        <option value="coordinator">Revisor / Coordinación</option>
        <option value="observer">Experto / Observador</option>
        <option value="client_responsible">Cliente: Responsable SGI</option>
        <option value="client_process_owner">Cliente: Owner de Proceso</option>
        <option value="client_sponsor">Cliente: Sponsor / Alta Dirección</option>
    </select></div>
        <button type="submit" class="btn">Invitar</button>
    </form>
</div>

<div class="card">
    <h3 style="margin-top: 0;">Usuarios del Tenant</h3>
    <table>
        <thead><tr><th>Nombre</th><th>Email</th><th>Rol</th></tr></thead>
        <tbody>
        {% for u in users %}
            <tr><td>{{ u.full_name }}</td><td>{{ u.email }}</td>
                <td><span class="badge badge-warning">{{ u.role }}</span></td></tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
